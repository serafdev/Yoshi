[package]
name = "yoshi_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inventory = "0.3"

# Platform integrations (optional features)
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
slack-morphism = { version = "2.0", optional = true }
teloxide = { version = "0.12", optional = true, features = ["macros", "rustls"] }

[features]
default = []
discord = ["serenity"]
slack = ["slack-morphism"]
telegram = ["teloxide"]
all-platforms = ["discord", "slack", "telegram"]

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3.8"
